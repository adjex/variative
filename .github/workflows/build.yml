name: Build
on:
  push:
    branches:
      - main
      - release
      - develop
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Verify Style / Syntax
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
      - name: Install Dependencies
        run: composer install --no-interaction
      - name: Run Codesniffer
        run: composer lint
  analyze:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    name: Static Analysis - PHP v${{ matrix.php }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install Dependencies
        run: composer install --no-interaction
      - name: Run PHPStan
        run: composer analyze
  compat:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    name: Compatibility Check - PHP v${{ matrix.php }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install Dependencies
        run: composer install --no-interaction
      - name: Run Phan
        run: composer compat
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3']
    name: Unit Test - PHP v${{ matrix.php }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
      - name: Install Dependencies
        run: composer install --no-interaction
      - name: Run PHPUnit
        run: composer test

